name: Approval gate

# The artists decide what gets built. This enforces it mechanically so a
# well-meaning agent (or a stranger with triage rights) cannot self-approve.
#
# An issue counts as APPROVED only when BOTH are true:
#   1. one of the Hermanos Amini has commented on it, and
#   2. one of them applied the `approved` label.
# Anyone else adding `approved` gets it stripped back off automatically.
#
# Either brother can approve alone. This is a two-artist piece and requiring
# both to sign off would just mean nothing ever ships while one of them is
# asleep. To change who can approve, edit ARTISTS below: it is the only place
# the list lives.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  verify:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Only the artists may approve
        uses: actions/github-script@v7
        with:
          script: |
            const ARTISTS = ['pedramamini', 'neemaamini'];
            const isArtist = who => ARTISTS.includes(String(who || '').toLowerCase());
            const nameList = ARTISTS.map(a => `@${a}`).join(' or ');

            const actor = context.payload.sender.login;
            const issue = context.payload.issue.number;

            if (!isArtist(actor)) {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue, name: 'approved'
              }).catch(() => {});
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue,
                body: `Removed \`approved\`: only ${nameList} can approve work on this ` +
                      `piece. Anyone may open and discuss issues, but the Hermanos Amini ` +
                      `accept the recommendation before anything is built. ` +
                      `See ART_DIRECTION.md.`
              });
              core.setFailed(`approved applied by ${actor}, not one of the artists`);
              return;
            }

            // Label is legitimate. Confirm an artist also left a comment, per the
            // rule. Either brother's comment satisfies it, and it does not have to
            // be the same brother who applied the label.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue, per_page: 100
            });
            const spoke = comments.some(c => isArtist(c.user.login));

            if (!spoke) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue,
                body: `\`approved\` is set, but the gate also wants a comment from ` +
                      `${nameList} saying what they actually want built. Agents: ` +
                      `hold until that exists.`
              });
              core.setFailed('approved label present but no comment from an artist');
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue,
              body: `Approved by @${actor} of the Hermanos Amini. This issue is now ` +
                    `eligible to be built.\n\n` +
                    `Implementation must obey ART_DIRECTION.md: keep both themes, ` +
                    `add rather than replace, declare a population cap, no new ` +
                    `dependencies, no committed audio.`
            });
